<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frame Calculator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">
    <h1>🧩 Frame Calculator</h1>
    <p class="subtitle">
      Calculate pieces for a modular 3D-printed frame.
    </p>

    <div class="row">
      <div>
        <label>Puzzle width</label>
        <input id="width" type="number" value="24" step="0.1">
      </div>

      <div>
        <label>Puzzle height</label>
        <input id="height" type="number" value="18" step="0.1">
      </div>
    </div>

    <label>Measurement</label>

    <select id="units">
      <option value="in">Inches</option>
      <option value="mm">Millimeters</option>
    </select>

    <button onclick="calculate()">
      Calculate Frame
    </button>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>

</body>
</html>
